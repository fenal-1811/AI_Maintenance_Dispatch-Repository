<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Maintenance Request Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container"><a class="navbar-brand text-primary" href="index.html">MaintainAI</a><span
                class="text-muted small">Employee Portal</span></div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="hero p-4 p-md-5 mb-4">
                    <h1 class="display-6 fw-bold">How can we help?</h1>
                    <p class="mb-0 opacity-75">Submit a maintenance issue and our team will coordinate the next steps.
                    </p>
                </div>
                <div class="card p-4 p-md-5">
                    <h2 class="page-title h3">Maintenance Request</h2>
                    <p class="muted">Please provide accurate details about the issue.</p>
                    <form id="requestForm">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Employee name *</label><input
                                    class="form-control" name="employee_name" required maxlength="100"></div>
                            <div class="col-md-6"><label class="form-label">Email *</label><input class="form-control"
                                    type="email" name="employee_email" required></div>
                            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control"
                                    name="phone" type="tel"></div>
                            <div class="col-md-6"><label class="form-label">Location *</label><input
                                    class="form-control" name="location" required placeholder="Building, floor, room">
                            </div>
                            <div class="col-12"><label class="form-label">Describe the issue *</label><textarea
                                    class="form-control" name="issue_description" rows="4" required maxlength="3000"
                                    placeholder="Describe what happened, when it started, and any relevant details."></textarea>
                            </div>
                            <div class="col-12"><button class="btn btn-primary w-100" type="submit"
                                    id="submitBtn">Submit maintenance request</button></div>
                        </div>
                    </form>
                    <div id="result" class="mt-3" aria-live="polite"></div>
                </div>
                <p class="text-center muted small mt-3">For immediate danger, contact your site emergency response team
                    directly.</p>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
